<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#11111a"/>
      <stop offset="100%" stop-color="#1a1020"/>
    </linearGradient>

    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>

  <circle cx="1040" cy="70" r="110"
          fill="none"
          stroke="#d8b4fe"
          stroke-width="1"
          opacity="0.18"/>

  <circle cx="1080" cy="210" r="150"
          fill="none"
          stroke="#f9a8d4"
          stroke-width="1"
          opacity="0.12"/>

  <circle cx="80" cy="260" r="100"
          fill="none"
          stroke="#d8b4fe"
          stroke-width="1"
          opacity="0.10"/>

  <g opacity="0.35" fill="#ffffff">
    <circle cx="170" cy="65" r="2"/>
    <circle cx="260" cy="225" r="2"/>
    <circle cx="930" cy="55" r="2"/>
    <circle cx="1000" cy="250" r="2"/>
    <circle cx="1130" cy="125" r="2"/>
  </g>

  <text x="600" y="115"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="58"
        font-weight="700"
        letter-spacing="12"
        fill="url(#text)"
        filter="url(#glow)">
    ANOLA
  </text>

  <text x="600" y="158"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18"
        font-weight="400"
        letter-spacing="6"
        fill="#e5e7eb">
    SOFTWARE DEVELOPER
  </text>

  <line x1="455" y1="190" x2="745" y2="190"
        stroke="#d8b4fe"
        stroke-width="1"
        opacity="0.7"/>

  <text x="600" y="225"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        letter-spacing="4"
        fill="#a1a1aa">
    CODE · CREATE · EVOLVE
  </text>

  <text x="600" y="258"
        text-anchor="middle"
        font-family="monospace"
        font-size="12"
        letter-spacing="2"
        fill="#71717a">
    building ideas into real software
  </text>
</svg>
